name: Playwright Tests

# Three groups, matching docs/testing/test-strategy.md#pipeline. They answer
# different questions, so they differ in scope and in what happens on failure:
# - post-push  : "does this change break the suite?" — smoke on the gate
#                projects, every PR update, drafts included
# - pre-merge  : same question, wider — full regression on api + Chromium,
#                when a PR is opened ready, marked ready, or labelled
#                `regression` to re-run it on a later commit
# - scheduled  : "did the site change under us?" — the full matrix nightly,
#                accessibility weekly. Nobody is watching at 03:00, so a
#                failure opens a `site-drift` issue instead of a red check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly — site drift
    - cron: '0 6 * * 1' # Monday 06:00 UTC — accessibility
  workflow_dispatch:

# Supersede PR runs; never cancel a scheduled drift run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Post-push smoke
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run smoke tests (gate projects)
        run: npm run test:smoke:pr
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 30

  regression:
    name: Pre-merge regression
    # `ready_for_review` alone would never fire for a PR opened ready, so
    # `opened` is included and drafts are excluded explicitly.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.event.action == 'opened' ||
       github.event.action == 'ready_for_review' ||
       (github.event.action == 'labeled' && github.event.label.name == 'regression'))
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run regression (api + Chromium, smoke on the gate projects)
        run: npm run test:regression:pr
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-regression
          path: playwright-report/
          retention-days: 30

  nightly:
    name: Nightly drift check
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run the full matrix
        run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 30
      # Our code didn't change since the last green run, so a failure here is
      # most likely the site moving. One open issue at a time, commented on
      # rather than duplicated.
      - name: Report possible site drift
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create site-drift \
            --description "Nightly run failed — the target site may have changed" \
            --color D93F0B --force
          body=$(printf '%s\n' \
            "The nightly run against automationexercise.com failed: $RUN_URL" \
            "" \
            "Our code has not changed since the last run, so the likely cause is a change on the site." \
            "Re-verify the affected behavior against the live site and update docs/criteria/ first;" \
            "only then adjust the tests (see AGENTS.md, Spec drift).")
          existing=$(gh issue list --label site-drift --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Nightly suite failed — check for site drift" \
              --label site-drift --body "$body"
          fi

  accessibility:
    name: Weekly accessibility scan
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run accessibility scan
        run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 30
